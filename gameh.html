<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mundo Abierto 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  #info {
    position: absolute; top: 10px; left: 10px; color: white;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 13px; pointer-events: none;
    z-index: 10;
  }
  #joyBase {
    position: absolute; bottom: 30px; left: 30px;
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
    display: none; touch-action: none;
  }
  #joyKnob {
    position: absolute; top: 50%; left: 50%;
    width: 55px; height: 55px; border-radius: 50%;
    background: rgba(255,255,255,0.6); border: 2px solid white;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  #jumpBtn {
    position: absolute; bottom: 50px; right: 40px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6);
    color: white; font-size: 14px; font-weight: bold;
    display: none; touch-action: none; user-select: none;
  }
  @media (pointer: coarse) {
    #joyBase, #jumpBtn { display: block; }
  }
</style>
</head>
<body>
<div id="info">🌍 Mundo 3D | WASD/Flechas + Espacio | Móvil: joystick</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<button id="jumpBtn">SALTAR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==================== ESCENA BÁSICA ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0xc8e0f0, 60, 180);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: window.devicePixelRatio < 2, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false; // mejor rendimiento móvil
document.body.appendChild(renderer.domElement);

// ==================== LUCES ====================
const sun = new THREE.DirectionalLight(0xfff5e0, 1.3);
sun.position.set(50, 80, 30);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x88bbff, 0x556633, 0.9));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ==================== TERRENO PROCEDURAL ====================
const SIZE = 400;
const SEG = 128;
const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
terrainGeo.rotateX(-Math.PI/2);

// Ruido simple
function hash(x, z) {
  const s = Math.sin(x*12.9898 + z*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function noise2D(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  const a = hash(xi, zi), b = hash(xi+1, zi);
  const c = hash(xi, zi+1), d = hash(xi+1, zi+1);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x, z) {
  let v = 0, amp = 1, freq = 1, total = 0;
  for (let i = 0; i < 4; i++) {
    v += noise2D(x*freq, z*freq) * amp;
    total += amp;
    amp *= 0.5; freq *= 2;
  }
  return v / total;
}

// Altura del terreno
function getHeight(x, z) {
  const base = fbm(x*0.015, z*0.015) * 12;
  const hills = Math.sin(x*0.03) * Math.cos(z*0.03) * 2;
  return base + hills - 3;
}

// Río: cauce con depresión
function riverDist(x, z) {
  // Río serpenteante a lo largo del eje Z
  const centerX = Math.sin(z * 0.04) * 25;
  return Math.abs(x - centerX);
}

const pos = terrainGeo.attributes.position;
const colors = [];
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  let h = getHeight(x, z);
  const rd = riverDist(x, z);
  if (rd < 6) {
    // Tallar el río
    const dip = (1 - rd/6) * 4;
    h -= dip;
  }
  pos.setY(i, h);
}

// Colores por vértice según altura
const tempColor = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const y = pos.getY(i);
  const rd = riverDist(x, z);

  if (rd < 6 && y < -1) {
    // Arena de río
    tempColor.setHSL(0.11, 0.35, 0.55);
  } else if (y > 6) {
    // Roca alta
    tempColor.setHSL(0.1, 0.1, 0.45);
  } else if (y > 2) {
    // Hierba seca
    tempColor.setHSL(0.22, 0.5, 0.42);
  } else {
    // Hierba verde
    const v = 0.35 + noise2D(x*0.5, z*0.5) * 0.15;
    tempColor.setHSL(0.28, 0.55, v);
  }
  colors.push(tempColor.r, tempColor.g, tempColor.b);
}
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

// ==================== AGUA DEL RÍO ====================
const waterGeo = new THREE.PlaneGeometry(SIZE, SIZE, 1, 1);
waterGeo.rotateX(-Math.PI/2);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x3399cc, transparent: true, opacity: 0.75,
  shininess: 100, specular: 0xffffff
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = -1.5;
scene.add(water);

// ==================== CÉSPED REAL (INSTANCED) ====================
// Geometría de brizna: triángulo estrecho
function makeBladeGeo() {
  const g = new THREE.BufferGeometry();
  const verts = new Float32Array([
    -0.06, 0, 0,
     0.06, 0, 0,
     0.0,  0.8, 0.03,
     0.0,  0.8, -0.03,
  ]);
  const idx = [0,1,2, 1,3,2];
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const bladeGeo = makeBladeGeo();
const bladeMat = new THREE.MeshLambertMaterial({
  color: 0x4a9d3a, side: THREE.DoubleSide
});

const GRASS_COUNT = 6000;
const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, GRASS_COUNT);
const dummy = new THREE.Object3D();
const grassColor = new THREE.Color();
let gi = 0;
let attempts = 0;
const grassColors = [];
while (gi < GRASS_COUNT && attempts < GRASS_COUNT * 4) {
  attempts++;
  const x = (Math.random() - 0.5) * SIZE * 0.85;
  const z = (Math.random() - 0.5) * SIZE * 0.85;
  const y = getHeight(x, z);
  if (y < -0.5) continue; // no césped en el agua
  if (riverDist(x, z) < 6 && y < 0.5) continue;
  if (y > 10) continue;

  dummy.position.set(x, y, z);
  dummy.rotation.y = Math.random() * Math.PI * 2;
  const scale = 0.7 + Math.random() * 0.8;
  dummy.scale.set(scale, scale * (0.8 + Math.random()*0.6), scale);
  dummy.updateMatrix();
  grass.setMatrixAt(gi, dummy.matrix);

  grassColor.setHSL(0.25 + Math.random()*0.08, 0.6, 0.35 + Math.random()*0.2);
  grassColors.push(grassColor.r, grassColor.g, grassColor.b);
  gi++;
}
grass.count = gi;
grass.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(grassColors), 3);
grass.instanceColor.needsUpdate = true;
grass.frustumCulled = false;
scene.add(grass);

// ==================== ÁRBOLES PROCEDURALES ====================
function createTree(x, z) {
  const y = getHeight(x, z);
  const tree = new THREE.Group();
  tree.position.set(x, y, z);

  const trunkH = 2.5 + Math.random() * 1.5;
  const trunkR = 0.25 + Math.random() * 0.15;

  // Tronco (cilindro de pocos lados)
  const trunkGeo = new THREE.CylinderGeometry(trunkR*0.7, trunkR, trunkH, 6);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = trunkH/2;
  tree.add(trunk);

  // Follaje: 3-4 esferas bajas para dar volumen
  const foliageMat = new THREE.MeshLambertMaterial({
    color: new THREE.Color().setHSL(0.28 + Math.random()*0.06, 0.55, 0.28 + Math.random()*0.08),
    flatShading: true
  });
  const blobs = 3 + Math.floor(Math.random() * 2);
  for (let b = 0; b < blobs; b++) {
    const r = 1.2 + Math.random() * 0.8;
    const foliageGeo = new THREE.IcosahedronGeometry(r, 0);
    const f = new THREE.Mesh(foliageGeo, foliageMat);
    f.position.set(
      (Math.random()-0.5) * 1.4,
      trunkH + 0.5 + Math.random() * 1.2,
      (Math.random()-0.5) * 1.4
    );
    f.rotation.set(Math.random(), Math.random(), Math.random());
    tree.add(f);
  }

  tree.rotation.y = Math.random() * Math.PI * 2;
  const s = 0.8 + Math.random() * 0.7;
  tree.scale.setScalar(s);
  return tree;
}

const TREE_COUNT = 120;
for (let i = 0; i < TREE_COUNT; i++) {
  let x, z, y;
  let tries = 0;
  do {
    x = (Math.random() - 0.5) * SIZE * 0.9;
    z = (Math.random() - 0.5) * SIZE * 0.9;
    y = getHeight(x, z);
    tries++;
  } while ((y < 0.5 || y > 9 || riverDist(x, z) < 8) && tries < 20);
  if (tries >= 20) continue;
  scene.add(createTree(x, z));
}

// ==================== NUBES VOLUMÉTRICAS ====================
function createCloudTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.5, 'rgba(255,255,255,0.7)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const cloudTex = createCloudTexture();
const cloudMat = new THREE.SpriteMaterial({
  map: cloudTex, transparent: true, opacity: 0.85, depthWrite: false
});

const clouds = [];
for (let i = 0; i < 30; i++) {
  const cluster = new THREE.Group();
  const puffs = 4 + Math.floor(Math.random() * 4);
  for (let p = 0; p < puffs; p++) {
    const sprite = new THREE.Sprite(cloudMat.clone());
    sprite.position.set(
      (Math.random()-0.5) * 12,
      (Math.random()-0.5) * 3,
      (Math.random()-0.5) * 12
    );
    const s = 8 + Math.random() * 8;
    sprite.scale.set(s, s * 0.7, 1);
    sprite.material.opacity = 0.6 + Math.random()*0.3;
    cluster.add(sprite);
  }
  cluster.position.set(
    (Math.random()-0.5) * 300,
    45 + Math.random() * 25,
    (Math.random()-0.5) * 300
  );
  clouds.push(cluster);
  scene.add(cluster);
}

// ==================== PÁJAROS ====================
const birds = [];
function createBird() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

  const body = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.7, 5), bodyMat);
  body.rotation.x = Math.PI/2;
  g.add(body);

  // Alas
  const wingGeo = new THREE.BufferGeometry();
  wingGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0,0,0, 0.9,0.1,0, 0,-0.05,0.3
  ]), 3));
  wingGeo.computeVertexNormals();
  const wingMat = new THREE.MeshLambertMaterial({ color: 0x111111, side: THREE.DoubleSide });

  const wingL = new THREE.Mesh(wingGeo, wingMat);
  const wingR = new THREE.Mesh(wingGeo, wingMat);
  wingR.scale.x = -1;
  g.add(wingL, wingR);
  g.userData = { wingL, wingR };
  return g;
}

for (let i = 0; i < 8; i++) {
  const b = createBird();
  const angle = Math.random() * Math.PI * 2;
  const r = 40 + Math.random() * 60;
  b.position.set(Math.cos(angle)*r, 18 + Math.random()*15, Math.sin(angle)*r);
  b.userData.angle = angle;
  b.userData.radius = r;
  b.userData.speed = 0.15 + Math.random() * 0.15;
  b.userData.flap = Math.random() * Math.PI * 2;
  scene.add(b);
  birds.push(b);
}

// ==================== PERSONAJE ====================
const player = new THREE.Group();

// Cuerpo
const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.7, 4, 8);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
const playerBody = new THREE.Mesh(bodyGeo, bodyMat);
playerBody.position.y = 1.0;
player.add(playerBody);

// Cabeza
const headGeo = new THREE.SphereGeometry(0.3, 12, 10);
const headMat = new THREE.MeshLambertMaterial({ color: 0xf5c9a0 });
const playerHead = new THREE.Mesh(headGeo, headMat);
playerHead.position.y = 1.8;
player.add(playerHead);

// "Ojos" (dirección frontal)
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyeMat);
eye1.position.set(0.1, 1.85, -0.27);
const eye2 = eye1.clone();
eye2.position.x = -0.1;
player.add(eye1, eye2);

// Piernas (para animación)
const legMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
const legGeo = new THREE.CapsuleGeometry(0.12, 0.5, 3, 6);
const legL = new THREE.Mesh(legGeo, legMat);
const legR = new THREE.Mesh(legGeo, legMat);
legL.position.set(-0.15, 0.35, 0);
legR.position.set(0.15, 0.35, 0);
player.add(legL, legR);

// Brazos
const armGeo = new THREE.CapsuleGeometry(0.1, 0.45, 3, 6);
const armL = new THREE.Mesh(armGeo, bodyMat);
const armR = new THREE.Mesh(armGeo, bodyMat);
armL.position.set(-0.5, 1.15, 0);
armR.position.set(0.5, 1.15, 0);
player.add(armL, armR);

player.position.set(0, getHeight(0, 0), 0);
scene.add(player);

// ==================== CONTROLES ====================
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

// Joystick
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const jumpBtn = document.getElementById('jumpBtn');
let joyActive = false, joyId = null, joyX = 0, joyY = 0;

function joyStart(e) {
  e.preventDefault();
  const t = e.changedTouches ? e.changedTouches[0] : e;
  joyActive = true;
  joyId = t.identifier;
  const rect = joyBase.getBoundingClientRect();
  updateJoy(t.clientX - rect.left - rect.width/2, t.clientY - rect.top - rect.height/2);
}
function joyMove(e) {
  if (!joyActive) return;
  const t = [...(e.changedTouches||[])].find(t => t.identifier === joyId);
  if (!t) return;
  const rect = joyBase.getBoundingClientRect();
  updateJoy(t.clientX - rect.left - rect.width/2, t.clientY - rect.top - rect.height/2);
}
function updateJoy(dx, dy) {
  const max = 55;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx/dist*max; dy = dy/dist*max; }
  joyX = dx / max;
  joyY = dy / max;
  joyKnob.style.left = `calc(50% + ${dx}px)`;
  joyKnob.style.top = `calc(50% + ${dy}px)`;
}
function joyEnd() {
  joyActive = false;
  joyX = joyY = 0;
  joyKnob.style.left = '50%';
  joyKnob.style.top = '50%';
}
joyBase.addEventListener('touchstart', joyStart, {passive:false});
joyBase.addEventListener('touchmove', joyMove, {passive:false});
joyBase.addEventListener('touchend', joyEnd);
joyBase.addEventListener('touchcancel', joyEnd);
joyBase.addEventListener('mousedown', joyStart);
addEventListener('mousemove', joyMove);
addEventListener('mouseup', joyEnd);

jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); tryJump(); });
jumpBtn.addEventListener('mousedown', e => { e.preventDefault(); tryJump(); });

function tryJump() {
  if (onGround) { velocityY = 8; onGround = false; }
}

// ==================== FÍSICA Y MOVIMIENTO ====================
let velocityY = 0;
let onGround = true;
const gravity = -22;
let playerAngle = 0;
const camOffset = new THREE.Vector3();
const camTarget = new THREE.Vector3();

// Reloj
const clock = new THREE.Clock();
let walkPhase = 0;

// ==================== LOOP ====================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Input
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (keys['Space']) tryJump();

  // Añadir joystick
  mx += joyX;
  mz += joyY;

  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }

  // Mover en relación a la cámara (dirección de vista actual)
  const speed = 6;
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  camDir.y = 0; camDir.normalize();
  const camRight = new THREE.Vector3(-camDir.z, 0, camDir.x);

  const moveX = camDir.x * (-mz) + camRight.x * mx;
  const moveZ = camDir.z * (-mz) + camRight.z * mx;
  const moveLen = Math.hypot(moveX, moveZ);

  if (moveLen > 0.05) {
    const nx = player.position.x + (moveX/moveLen) * speed * dt * Math.min(moveLen, 1);
    const nz = player.position.z + (moveZ/moveLen) * speed * dt * Math.min(moveLen, 1);
    player.position.x = nx;
    player.position.z = nz;
    playerAngle = Math.atan2(moveX, moveZ);
    walkPhase += dt * 12;
  } else {
    walkPhase *= 0.9;
  }

  // Rotación suave
  let da = playerAngle - player.rotation.y;
  while (da > Math.PI) da -= Math.PI*2;
  while (da < -Math.PI) da += Math.PI*2;
  player.rotation.y += da * Math.min(1, dt * 10);

  // Física vertical
  velocityY += gravity * dt;
  player.position.y += velocityY * dt;

  const groundY = getHeight(player.position.x, player.position.z);
  // Dentro del río puede hundirse un poco
  const inRiver = riverDist(player.position.x, player.position.z) < 5.5;
  const floorY = inRiver ? groundY : groundY;

  if (player.position.y <= floorY) {
    player.position.y = floorY;
    velocityY = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  // Animación de piernas/brazos
  const legSwing = Math.sin(walkPhase) * 0.5 * Math.min(moveLen, 1);
  legL.rotation.x = legSwing;
  legR.rotation.x = -legSwing;
  armL.rotation.x = -legSwing * 0.8;
  armR.rotation.x = legSwing * 0.8;

  // Balanceo cuerpo al caminar
  playerBody.position.y = 1.0 + Math.abs(Math.sin(walkPhase)) * 0.05 * Math.min(moveLen, 1);

  // ==================== CÁMARA TERCERA PERSONA ====================
  const camDist = 7;
  const camHeight = 4;
  camOffset.set(0, camHeight, 0);
  const angleForCam = player.rotation.y;
  const behindX = player.position.x - Math.sin(angleForCam) * camDist;
  const behindZ = player.position.z - Math.cos(angleForCam) * camDist;

  const desiredCam = new THREE.Vector3(behindX, player.position.y + camHeight, behindZ);
  camera.position.lerp(desiredCam, Math.min(1, dt * 4));

  camTarget.lerp(
    new THREE.Vector3(player.position.x, player.position.y + 1.5, player.position.z),
    Math.min(1, dt * 6)
  );
  camera.lookAt(camTarget);

  // ==================== ANIMACIONES AMBIENTE ====================
  // Nubes a la deriva
  clouds.forEach(c => { c.position.x += dt * 0.4; if (c.position.x > 200) c.position.x = -200; });

  // Río ondulante
  water.position.y = -1.5 + Math.sin(t * 0.8) * 0.05;

  // Pájaros
  birds.forEach(b => {
    b.userData.angle += b.userData.speed * dt;
    b.position.x = Math.cos(b.userData.angle) * b.userData.radius;
    b.position.z = Math.sin(b.userData.angle) * b.userData.radius;
    b.rotation.y = -b.userData.angle + Math.PI/2;
    b.userData.flap += dt * 12;
    const flap = Math.sin(b.userData.flap) * 0.7;
    b.userData.wingL.rotation.z = flap;
    b.userData.wingR.rotation.z = -flap;
  });

  renderer.render(scene, camera);
}

animate();

// ==================== RESIZE ====================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
